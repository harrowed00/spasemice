<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:white;color:black;margin:0;padding:15px}
h1{font-size:25px;font-weight:500;margin:5px 0 18px}
.app{min-width:0}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
button,select{font-family:Arial;font-size:15px;background:white;color:black;border:1px solid #bbb;padding:9px}
button:active{background:#eee}
.page{display:none}
.page.active{display:block}
.calc{max-width:430px}
#display{width:100%;height:55px;border:1px solid #bbb;text-align:right;font-size:25px;padding:10px;margin-bottom:8px}
.keys{display:flex;flex-wrap:wrap;gap:5px}
.keys button{width:calc((100% - 15px)/4);height:48px;font-size:18px}
.formula-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
#search{flex:1;min-width:150px;border:0;border-bottom:1px solid black;border-radius:0;background:transparent;outline:none;padding:8px;font-size:16px}
.formula{border-bottom:1px solid #ddd;padding:13px 0}
.formula-head{display:block;margin-bottom:10px}
.formula-name{font-size:16px;font-weight:500;display:block;margin-bottom:10px}
.equation{font-size:17px;display:flex;align-items:baseline;gap:3px;flex-wrap:wrap;line-height:2.2}
.equation input,.conversion input{display:inline-block;width:48px;min-width:35px;max-width:110px;height:25px;border:0;border-bottom:1px solid black;border-radius:0;background:transparent;outline:none;text-align:center;padding:2px 4px;font-family:Arial;font-size:16px;color:black;caret-color:black;pointer-events:auto;position:relative;z-index:2;touch-action:manipulation;user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none}
.equation input::placeholder{color:rgba(0,0,0,.28);opacity:1}
.conversion input::placeholder{color:rgba(0,0,0,.35);opacity:1}
.equation input:focus,.conversion input:focus{border-bottom:2px solid black;background:#f7f7f7}
.formula button{margin-top:10px}
.result{font-size:16px;margin-top:9px}
.conversion{padding:13px 0;border-bottom:1px solid #ddd}
.conversion h3{font-size:16px;font-weight:500;margin-bottom:10px}
.conversion input{width:85px;min-width:85px;text-align:left}
</style>
</head>
<body>
<div class="app">
<h1>Calculator</h1>
<nav>
<button onclick="showPage('calculator')">Calculator</button>
<button onclick="showPage('formulas')">Formulas</button>
<button onclick="showPage('conversions')">Conversions</button>
</nav>
<section id="calculator" class="page active">
<div class="calc">
<input id="display" type="text" readonly>
<div class="keys">
<button onclick="clearCalc()">AC</button><button onclick="delCalc()">DEL</button><button onclick="key('/')">÷</button><button onclick="key('*')">×</button>
<button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button><button onclick="key('-')">−</button>
<button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button><button onclick="key('+')">+</button>
<button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button><button onclick="calculate()">=</button>
<button onclick="key('0')">0</button><button onclick="key('.')">.</button><button onclick="key('(')">(</button><button onclick="key(')')">)</button>
<button onclick="key('Math.PI')">π</button><button onclick="key('Math.sqrt(')">√</button><button onclick="key('**2')">x²</button><button onclick="key('/100')">%</button>
</div>
</div>
</section>
<section id="formulas" class="page">
<div class="formula-tools">
<input id="search" placeholder="Search formulas" oninput="renderFormulas()">
<select id="category" onchange="renderFormulas()"><option>All</option></select>
</div>
<div id="formula-list"></div>
</section>
<section id="conversions" class="page"><div id="conversion-list"></div></section>
</div>
<script>

function clearCalc(){$('display').value=''}
function delCalc(){$('display').value=$('display').value.slice(0,-1)}

function factorial(n){if(!Number.isInteger(n)||n<0||n>170)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
const categories=[...new Set(formulas.map(f=>f[0]))].sort();
categories.forEach(c=>{const o=document.createElement('option');o.textContent=c;$('category').appendChild(o)});
function renderFormulas(){
const list=$('formula-list');list.innerHTML='';
const search=$('search').value.toLowerCase(),category=$('category').value;
formulas.forEach(f=>{
if(category!=='All'&&f[0]!==category)return;
if(!(f[0]+' '+f[1]+' '+f[2]).toLowerCase().includes(search))return;
const card=document.createElement('div');card.className='formula';
const head=document.createElement('div');head.className='formula-head';
const name=document.createElement('span');name.className='formula-name';name.textContent=f[1];head.appendChild(name);
const equation=document.createElement('div');equation.className='equation';
const inputMap={},variableInputs={};
const variables=[...new Set(f[3])].sort((a,b)=>b.length-a.length);
function addInput(variable){
const input=document.createElement('input');
input.type='text';input.inputMode='decimal';input.placeholder=variable;input.setAttribute('aria-label',variable);input.autocomplete='off';input.spellcheck=false;input.readOnly=false;input.disabled=false;input.tabIndex=0;input.dataset.variable=variable;input.style.width=Math.max(48,variable.length*10+18)+'px';
if(!inputMap[variable])inputMap[variable]=input;
if(!variableInputs[variable])variableInputs[variable]=[];
variableInputs[variable].push(input);
input.addEventListener('input',()=>variableInputs[variable].forEach(other=>{if(other!==input)other.value=input.value}));
equation.appendChild(input);
}
function addTextWithInputs(text){
let i=0,buffer='';
while(i<text.length){
let found=null;
for(const variable of variables){
if(!text.startsWith(variable,i))continue;
const before=i>0?Array.from(text.slice(0,i)).pop():'';
const after=Array.from(text.slice(i+variable.length))[0]||'';
const isWord=ch=>!!ch&&/[\p{L}\p{N}]/u.test(ch)&&!/[⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]/u.test(ch);
if(isWord(before)||isWord(after))continue;
found=variable;
break;
}
if(found){
if(buffer){equation.appendChild(document.createTextNode(buffer));buffer=''}
addInput(found);
i+=found.length;
}else{
const char=Array.from(text.slice(i))[0];
buffer+=char;
i+=char.length;
}
}
if(buffer)equation.appendChild(document.createTextNode(buffer));
}
